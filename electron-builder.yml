appId: id.pribadi.stockuploader
productName: Stock Uploader
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  # Modul native opsional milik ssh2: tanpa ini ssh2 memakai versi JavaScript,
  # jadi installer sama untuk Windows, Mac Intel, dan Mac Apple Silicon.
  - '!node_modules/cpu-features/**'
  - '!node_modules/ssh2/lib/protocol/crypto/build/**'
npmRebuild: false
afterPack: build/afterPack.cjs
asar: true
# Supaya installer kecil: kompresi maksimum dan hanya bahasa Inggris + Indonesia
# dari bahasa bawaan Electron (sisanya ±40 MB tidak terpakai).
compression: maximum
electronLanguages: [en, en-US, id]
# ExifTool harus berada di luar arsip supaya bisa dijalankan.
asarUnpack:
  - '**/node_modules/exiftool-vendored.exe/**'
  - '**/node_modules/exiftool-vendored.pl/**'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Stock-Uploader-Setup-${version}.${ext}
  # ExifTool versi Perl hanya untuk Mac/Linux.
  files:
    - '!node_modules/exiftool-vendored.pl/**'
  # Tanpa sertifikat resmi: lewati alat tanda tangan (butuh hak admin di Windows).
  signAndEditExecutable: false
nsis:
  # Tanpa file .blockmap (hanya dipakai pembaruan otomatis, yang tidak ada di aplikasi ini).
  differentialPackage: false
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  # Hanya Apple Silicon (M1/M2/M3/M4): installer universal 2x lebih besar.
  target:
    - target: dmg
      arch: [arm64]
  files:
    - '!node_modules/exiftool-vendored.exe/**'
  category: public.app-category.productivity
  # Tanpa sertifikat Apple; tanda tangan ad-hoc dibuat di build/afterPack.cjs.
  identity: null
  artifactName: Stock-Uploader-${version}-mac.${ext}
dmg:
  # ULFO (lzfse) lebih kecil daripada UDZO bawaan; butuh macOS 10.11+.
  format: ULFO
