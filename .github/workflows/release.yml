name: Rilis

# Terbitkan versi baru ke repo publik hadyanbaqi/stock-uploader-releases supaya aplikasi bisa
# memperbarui dirinya sendiri. Naikkan "version" di package.json dan push ke main, lalu salah satu:
#   a) Actions > Rilis > Run workflow (isi catatan "Apa yang baru"), atau
#   b) git tag -a v1.7.0 -m "catatan" && git push origin v1.7.0
# Versi selalu diambil dari package.json.
#
# Butuh secret RELEASES_TOKEN di repo ini: token GitHub (fine-grained) dengan izin
# "Contents: Read and write" hanya untuk repo hadyanbaqi/stock-uploader-releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: 'Catatan "Apa yang baru" (kosong = pesan commit terakhir)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: rilis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cek-versi:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Versi dari package.json (kalau lewat tag, harus sama)
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME tidak sama dengan versi package.json ($PKG). Naikkan versi di package.json dulu."
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
      - name: Token rilis harus ada
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret RELEASES_TOKEN belum diisi (Settings > Secrets and variables > Actions)."
            exit 1
          fi

  build:
    needs: cek-versi
    uses: ./.github/workflows/build.yml

  terbitkan:
    needs: [cek-versi, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: installer

      - name: Catatan rilis (isian tombol, pesan tag, atau pesan commit)
        env:
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          NOTES="$INPUT_NOTES"
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git fetch --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
            NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          fi
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then NOTES=$(git log -1 --format=%B); fi
          printf '%s\n' "$NOTES" > catatan.md

      - name: Susun latest.json (versi, sidik SHA-256, ukuran)
        id: m
        run: |
          node scripts/release-manifest.mts "${{ needs.cek-versi.outputs.version }}" installer catatan.md latest.json | tee manifest.log
          echo "assets=$(grep '^ASSETS=' manifest.log | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Terbitkan ke hadyanbaqi/stock-uploader-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.cek-versi.outputs.version }}
          ASSETS: ${{ steps.m.outputs.assets }}
        run: |
          mapfile -t FILES < <(node -e "for (const f of JSON.parse(process.env.ASSETS)) console.log(f)")
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease";; esac
          gh release create "v$VERSION" "${FILES[@]}" latest.json \
            --repo hadyanbaqi/stock-uploader-releases \
            --title "Stock Uploader $VERSION" \
            --notes "$(node -e "console.log(JSON.parse(require('fs').readFileSync('latest.json','utf8')).notes || 'Pembaruan Stock Uploader.')")" \
            $PRE
