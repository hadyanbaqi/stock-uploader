name: Build installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            files: dist/*.exe
          - os: macos-latest
            dist: dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cek tipe kode
        run: npm run typecheck

      - name: Tes koneksi FTP/FTPS/SFTP (server lokal)
        run: npm run test:conn

      - name: Buat installer
        run: npm run ${{ matrix.dist }}

      - uses: actions/upload-artifact@v4
        with:
          name: Stock-Uploader-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
