name: Build installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            files: dist/*.exe
            app: dist/win-unpacked/Stock Uploader.exe
          - os: macos-latest
            dist: dist:mac
            files: dist/*.dmg
            app: dist/mac-arm64/Stock Uploader.app/Contents/MacOS/Stock Uploader
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cek tipe kode
        run: npm run typecheck

      - name: Tes koneksi FTP/FTPS/SFTP (server lokal)
        run: npm run test:conn

      - name: Tes antrean upload (putus, jeda, coba ulang)
        run: npm run test:upload

      - name: Tes metadata (aturan SEO, CSV, AI tiruan, ExifTool)
        run: npm run test:meta

      - name: Tes alur kerja (impor CSV, folder agensi, metadata-master, pindah file)
        run: npm run test:csv

      - name: Tes aplikasi asli (upload, riwayat, metadata)
        timeout-minutes: 10
        run: npm run test:app
        continue-on-error: true

      - name: Buat installer
        run: npm run ${{ matrix.dist }}

      - name: Tes aplikasi hasil installer
        # Mac bertanda tangan ad-hoc bisa menunggu izin Keychain yang tidak bisa diklik di CI.
        timeout-minutes: 5
        run: node scripts/test-app.mts
        env:
          APP: ${{ github.workspace }}/${{ matrix.app }}
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: Stock-Uploader-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
